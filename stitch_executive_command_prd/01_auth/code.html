<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Coteccons - Executive Command Auth</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10CFC9", // Bright Turquoise
                        "brand-navy": "#16315E", // Biscay Navy
                        "background-light": "#F4F5F7",
                        "surface": "#FFFFFF",
                        "slate-900": "#0F172A",
                        "slate-500": "#64748B",
                        "risk-high": "#EF4444",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["IBM Plex Sans", "sans-serif"],
                        "mono": ["IBM Plex Mono", "monospace"],
                    },
                    borderRadius: {
                        "sharp": "0px",
                        "DEFAULT": "4px",
                        "full": "9999px",
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom styles for specific animations that might be tricky with just Tailwind utilities */
        .scan-ring {
            animation: ripple 2s infinite;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 1;
                border-width: 2px;
            }
            100% {
                transform: scale(2);
                opacity: 0;
                border-width: 0px;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-brand-navy h-screen w-full flex flex-col overflow-hidden font-body antialiased select-none">
<!-- Top Section (60% Height) -->
<div class="relative h-[60%] w-full bg-brand-navy flex items-center justify-center flex-col z-10">
<!-- Abstract Background Pattern (Subtle) -->
<div class="absolute inset-0 opacity-10 pointer-events-none" data-alt="Subtle radial gradient emanating from the bottom center to highlight the logo" style="background-image: radial-gradient(circle at 50% 120%, #10CFC9 0%, transparent 40%);">
</div>
<!-- Logo -->
<h1 class="font-display font-bold text-[32px] tracking-[-0.02em] text-white leading-tight relative z-20">
            COTECCONS
        </h1>
</div>
<!-- Bottom Section (40% Height) -->
<div class="relative h-[40%] w-full bg-surface rounded-t-none flex flex-col items-center pt-16 px-6 pb-8 z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.2)]">
<!-- Biometric Indicator (Centered on split line visually, but physically in bottom container for ease) -->
<!-- We use negative margin to pull it up into the break -->
<div class="absolute -top-[44px] left-1/2 -translate-x-1/2">
<div class="relative flex items-center justify-center w-[88px] h-[88px]">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary/30 scan-ring"></div>
<div class="absolute inset-0 rounded-full border border-primary/20 scan-ring" style="animation-delay: 0.5s;"></div>
<!-- Main Icon Container -->
<div class="relative z-10 w-[88px] h-[88px] bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-surface">
<span class="material-symbols-outlined text-[48px] text-primary">
                        face
                    </span>
</div>
<!-- Status Badge (Optional visual flair) -->
<div class="absolute -bottom-1 z-20 bg-primary text-brand-navy text-[10px] font-mono font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                    Scanning
                </div>
</div>
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col items-center justify-between w-full mt-4">
<!-- Status Text -->
<div class="text-center space-y-2">
<h2 class="font-display font-medium text-lg text-slate-900 tracking-wide uppercase">Identity Check</h2>
<p class="text-slate-500 text-sm font-body">Verifying credentials via FaceID...</p>
</div>
<!-- Manual Fallback -->
<div class="w-full max-w-xs space-y-4">
<button class="group w-full flex items-center justify-center gap-3 py-3 px-4 border border-slate-200 rounded hover:border-brand-navy hover:bg-slate-50 transition-all duration-200 active:scale-[0.98]">
<img alt="Microsoft Logo" class="w-5 h-5" data-alt="Microsoft four-square logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5MOJ-BETOm32o_rDaH04hcQG6bSiZixHubqqQ9ffC4Hwle2A3NDMuyBFvOmYsZ2JIWbqz5VvgyReRxLcktxu7nISpIJOPJOI6tGCjKqd-GiIKt4cyL-OYoselM2QWlxRmvCMvXu9UD_eZo9fV2ZDJKf0ys0kk3v4Mt5vzHJJZyjYjmdJCWbFZA-wScsdWDfR8WjeyJcWU_s-XflNQ1WhnCwIEF9tJKaZEZL8ugQ1wyIjzAEkecx_N2m-p6nulDCKWuzI72C9rRSyL"/>
<span class="font-body font-medium text-slate-900 text-sm group-hover:text-brand-navy">Sign in with Microsoft</span>
</button>
<div class="text-center">
<button class="text-xs font-mono text-slate-400 hover:text-brand-navy transition-colors">
                        USE PIN CODE
                    </button>
</div>
</div>
</div>
</div>
<!-- Toast Notification (Hidden by default, simulated state) -->
<!-- Ideally controlled by JS, visually present for design context but hidden via opacity/transform for clean state -->
<div class="fixed top-12 left-1/2 -translate-x-1/2 w-auto max-w-[90%] z-50 pointer-events-none opacity-0 translate-y-[-20px] transition-all duration-300">
<div class="bg-risk-high text-white px-4 py-3 rounded shadow-xl flex items-center gap-3">
<span class="material-symbols-outlined text-[20px]">warning</span>
<span class="text-sm font-medium">Biometric failed. Use PIN.</span>
</div>
</div>
</body></html>
